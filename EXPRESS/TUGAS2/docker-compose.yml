version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: postgres_todo
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TODO
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_todo
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: lauarana@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 1234
    ports:
      - "5050:80"

volumes:
  pgdata:
