<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Fosan TODO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 450px;
    }

    .header {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .form-container {
      padding: 40px 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid #e1e8ed;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #fafbfc;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
    }

    .file-input {
      padding: 12px;
      border: 2px dashed #e1e8ed;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fafbfc;
    }

    .file-input:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .btn {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 20px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .link-container {
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #e1e8ed;
    }

    .link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .link:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border-color: #28a745;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border-color: #dc3545;
    }

    @media (max-width: 768px) {
      .register-container {
        margin: 10px;
        border-radius: 15px;
      }
      
      .form-container {
        padding: 30px 20px;
      }
      
      .header {
        padding: 30px 20px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="header">
      <h1>👤 Register</h1>
      <p>Create your Fosan TODO account</p>
    </div>

    <div class="form-container">
      <div id="alertContainer"></div>

      <form id="registerForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
        </div>
        
        <div class="form-group">
          <label for="foto">Profile Photo</label>
          <input type="file" id="foto" name="foto" class="form-control file-input" accept="image/*" required>
        </div>
        
        <button type="submit" class="btn">Create Account</button>
      </form>

      <div class="link-container">
        <p>Already have an account? <a href="login.html" class="link">Login Here</a></p>
      </div>
    </div>
  </div>

  <script>
    // Show alert messages
    function showAlert(message, type = 'success') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.appendChild(alert);
      
      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Set loading state
    function setLoading(form, loading) {
      const btn = form.querySelector('.btn');
      
      if (loading) {
        btn.disabled = true;
        btn.textContent = 'Creating Account...';
      } else {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });

    // Register form handler
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      setLoading(this, true);

      try {
        const formData = new FormData(this);
        const res = await fetch("/user/register", {
          method: "POST",
          body: formData
        });
        
        const result = await res.json();
        
        if (res.ok) {
          showAlert("Registration successful! Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showAlert(result.message || "Registration failed", "error");
        }
      } catch (error) {
        showAlert("Network error. Please try again.", "error");
      } finally {
        setLoading(this, false);
      }
    });
  </script>
</body>
</html>
