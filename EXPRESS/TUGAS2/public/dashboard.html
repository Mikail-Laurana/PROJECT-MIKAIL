<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Fosan TODO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .header {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left h1 {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 5px;
    }

    .header-left p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .user-details h3 {
      margin-bottom: 5px;
    }

    .user-details p {
      opacity: 0.8;
      font-size: 0.9rem;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 15px;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .content {
      padding: 40px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .stat-label {
      color: #666;
      font-size: 1rem;
    }

    .section {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    .section h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 1.5rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid #e1e8ed;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #fafbfc;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
    }

    .btn {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .todo-item {
      background: white;
      border: 2px solid #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .todo-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      border-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .todo-actions {
      display: flex;
      gap: 10px;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 8px;
    }

    .btn-danger {
      background: linear-gradient(45deg, #dc3545, #c82333);
    }

    .btn-danger:hover {
      box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
    }

    .alert {
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border-color: #28a745;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border-color: #dc3545;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state h3 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      .container {
        margin: 10px;
        border-radius: 15px;
      }
      
      .content {
        padding: 20px;
      }
      
      .section {
        padding: 20px;
      }
      
      .header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }

      .header-left h1 {
        font-size: 2rem;
      }

      .user-info {
        justify-content: center;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>✨ Fosan TODO</h1>
        <p>Your personal task manager</p>
      </div>
      
      <div class="user-info">
        <div class="user-avatar">👤</div>
        <div class="user-details">
          <h3 id="userName">Loading...</h3>
          <p>Welcome back!</p>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="content">
      <div id="alertContainer"></div>

      <!-- Statistics -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalTodos">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">📋</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">🎯</div>
          <div class="stat-label">Productive</div>
        </div>
      </div>

      <!-- Add Todo Form -->
      <div class="section">
        <h2>➕ Add New Task</h2>
        <form id="todoForm">
          <div class="form-group">
            <label for="todoInput">What needs to be done?</label>
            <input type="text" id="todoInput" name="kegiatan" class="form-control" placeholder="Enter your task..." required>
          </div>
          <button type="submit" class="btn">Add Task</button>
        </form>
      </div>

      <!-- Todo List -->
      <div class="section">
        <h2>📋 Your Tasks</h2>
        <div id="todoList">
          <!-- Loading state -->
          <div class="empty-state">
            <svg fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
            </svg>
            <h3>Loading your tasks...</h3>
            <p>Please wait a moment</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = null;

    // Check authentication
    document.addEventListener('DOMContentLoaded', function() {
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      
      // Load user data
      const userData = localStorage.getItem('user');
      if (userData) {
        currentUser = JSON.parse(userData);
        document.getElementById('userName').textContent = currentUser.name || 'User';
      }
      
      loadTodos();
    });

    // Show alert messages
    function showAlert(message, type = 'success') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.appendChild(alert);
      
      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Set loading state
    function setLoading(form, loading) {
      const btn = form.querySelector('.btn');
      
      if (loading) {
        btn.disabled = true;
        btn.textContent = 'Adding Task...';
      } else {
        btn.disabled = false;
        btn.textContent = 'Add Task';
      }
    }

    // Todo form handler
    document.getElementById("todoForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      setLoading(this, true);

      try {
        const kegiatan = this.kegiatan.value.trim();
        
        if (!kegiatan) {
          showAlert("Please enter a task", "error");
          return;
        }

        const res = await fetch("/todo", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ kegiatan })
        });

        const result = await res.json();
        
        if (res.ok) {
          showAlert("Task added successfully!", "success");
          this.reset();
          loadTodos();
        } else {
          if (res.status === 401) {
            handleAuthError();
          } else {
            showAlert(result.message || "Failed to add task", "error");
          }
        }
      } catch (error) {
        showAlert("Network error. Please try again.", "error");
      } finally {
        setLoading(this, false);
      }
    });

    // Load todos
    async function loadTodos() {
      try {
        const res = await fetch("/todo", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (res.status === 401) {
          handleAuthError();
          return;
        }

        if (!res.ok) {
          throw new Error('Failed to load todos');
        }

        const todos = await res.json();
        renderTodos(todos);
        updateStats(todos);
      } catch (error) {
        showAlert("Failed to load tasks", "error");
        renderTodos([]);
      }
    }

    // Render todos
    function renderTodos(todos) {
      const list = document.getElementById("todoList");
      
      if (todos.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" clip-rule="evenodd"></path>
            </svg>
            <h3>No tasks yet</h3>
            <p>Add your first task to get started!</p>
          </div>
        `;
        return;
      }

      list.innerHTML = todos.map(todo => `
        <div class="todo-item">
          <div class="todo-text">${escapeHtml(todo.kegiatan)}</div>
          <div class="todo-actions">
            <button class="btn btn-danger btn-small" onclick="deleteTodo('${todo.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Update statistics
    function updateStats(todos) {
      document.getElementById('totalTodos').textContent = todos.length;
    }

    // Delete todo
    async function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this task?')) {
        return;
      }

      try {
        const res = await fetch(`/todo/${id}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (res.status === 401) {
          handleAuthError();
          return;
        }

        if (res.ok) {
          showAlert("Task deleted successfully!", "success");
          loadTodos();
        } else {
          showAlert("Failed to delete task", "error");
        }
      } catch (error) {
        showAlert("Network error. Please try again.", "error");
      }
    }

    // Handle authentication errors
    function handleAuthError() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      showAlert("Session expired. Please login again.", "error");
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    }

    // Logout function
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        showAlert("Logged out successfully!", "success");
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);
      }
    }

    // Utility function to escape HTML
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>
