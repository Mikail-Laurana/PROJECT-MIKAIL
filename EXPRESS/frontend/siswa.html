<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Dashboard Siswa</h2>

  <h3>Tugas Saya</h3>
  <div id="tugasSiswa"></div>

  <script>
    const BASE_URL = "http://localhost:3000";
    const token = localStorage.getItem("siswaToken");

    async function loadTugas() {
      const res = await fetch(`${BASE_URL}/tugas/siswa`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      const container = document.getElementById("tugasSiswa");
      container.innerHTML = "";
      data.forEach(t => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
          <b>${t.judul}</b> dari <i>${t.nama_guru}</i><br>
          ${t.deskripsi} <br>
          Deadline: ${t.deadline}
        `;
        container.appendChild(div);
      });
    }

    loadTugas();
  </script>
</body>
</html>
