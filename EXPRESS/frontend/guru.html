<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Guru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Dashboard Guru</h2>

  <h3>Buat Tugas Baru</h3>
  <form id="buatTugasForm">
    <input type="number" id="siswaId" placeholder="ID Siswa" required>
    <input type="text" id="judul" placeholder="Judul Tugas" required>
    <textarea id="deskripsi" placeholder="Deskripsi"></textarea>
    <input type="date" id="deadline">
    <button type="submit">Buat Tugas</button>
  </form>

  <h3>Daftar Tugas Saya</h3>
  <div id="daftarTugas"></div>

  <script>
    const BASE_URL = "http://localhost:3000";
    const token = localStorage.getItem("guruToken");

    async function loadTugas() {
      const res = await fetch(`${BASE_URL}/tugas/guru`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      const container = document.getElementById("daftarTugas");
      container.innerHTML = "";
      data.forEach(t => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
          <b>${t.judul}</b> untuk <i>${t.nama_siswa}</i><br>
          ${t.deskripsi} <br>
          Deadline: ${t.deadline}
        `;
        container.appendChild(div);
      });
    }

    document.getElementById("buatTugasForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch(`${BASE_URL}/tugas`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          siswa_id: document.getElementById("siswaId").value,
          judul: document.getElementById("judul").value,
          deskripsi: document.getElementById("deskripsi").value,
          deadline: document.getElementById("deadline").value
        })
      });
      loadTugas();
    });

    loadTugas();
  </script>
</body>
</html>
